name: Release

# Push a tag like v0.0.1 to build a signed release APK and publish it as a GitHub release.
# The tag must match versionName in build.gradle.kts.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANYREMOTE_KEYSTORE_BASE64    release.keystore, base64-encoded (key alias key0)
#   ANYREMOTE_KEYSTORE_PASSWORD  password for both the keystore and the key

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check tag matches versionName
        id: version
        run: |
          version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' build.gradle.kts)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANYREMOTE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANYREMOTE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANYREMOTE_KEYSTORE_BASE64 and ANYREMOTE_KEYSTORE_PASSWORD repository secrets first"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # GitHub releases ship the github flavor; F-Droid builds the fdroid flavor itself.
      - name: Test and build release APK
        env:
          ANYREMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANYREMOTE_KEYSTORE_PASSWORD }}
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease

      # The APK is named after the project and flavor (AnyRemote-github-release.apk); Gradle adds -unsigned
      # when no signing config applied. apksigner is the real check.
      - name: Verify signature
        id: apk
        run: |
          shopt -s nullglob
          dir=build/outputs/apk/github/release
          unsigned=("$dir"/*-unsigned.apk)
          if [ ${#unsigned[@]} -gt 0 ]; then
            echo "::error::Release APK is unsigned: ${unsigned[*]}"
            exit 1
          fi
          apks=("$dir"/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}:"; ls "$dir"; exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Package signed release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          mkdir release-artifact
          cd release-artifact
          out="AnyRemote-$VERSION.apk"
          cp "../$APK" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload signed release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: release-artifact/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          out="AnyRemote-$VERSION.apk"
          sha256sum --check -- "$out.sha256"
          gh release create "$GITHUB_REF_NAME" "$out" "$out.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AnyRemote $VERSION" \
            --generate-notes
