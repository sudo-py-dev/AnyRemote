name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - uses: android-actions/setup-android@v4

      # The runner's preinstalled SDK may lag behind; install exactly what build.gradle.kts needs.
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, build and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anyremote-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: build/reports/lint-results-debug.html
          if-no-files-found: ignore
