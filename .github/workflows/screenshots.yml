name: Screenshots

# Renders every @PreviewTest preview in src/screenshotTest to PNGs and uploads them,
# so UI changes can be reviewed without a device. Nothing is compared or committed.

on:
  pull_request:
    paths:
      - "src/main/kotlin/**/ui/**"
      - "src/main/res/**"
      - "src/screenshotTest/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Render previews
        run: ./gradlew updateDebugScreenshotTestDefaultTestSuite

      - name: Collect images
        if: always()
        run: |
          mkdir -p screenshots
          find src build -path '*reference*' -name '*.png' -exec cp {} screenshots/ \; 2>/dev/null || true
          ls screenshots | head -100
          echo "$(ls screenshots | wc -l) images"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
