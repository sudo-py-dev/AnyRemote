name: Feature request
description: Suggest an idea or an improvement to the app.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or situation this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AnyRemote help?
      description: The change you have in mind.
    validations:
      required: true
